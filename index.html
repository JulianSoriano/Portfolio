<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Julian Torres Portfolio</title><meta name="robots" content="index,follow"></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="page-style">
/* Layout: a cartridge shelf. Masthead, filter rail, then a grid of project "carts", each with a coded label strip. */
:root{
  --bg:#eceef2; --surface:#f8f9fb; --ink:#14171f; --muted:#5a6070; --line:#cfd3dc;
  --accent:#2a46c9; --accent-ink:#ffffff; --warm:#c9821a; --ok:#1d7a4f; --danger:#b3312a;
  --cat-re:#2a46c9; --cat-gm:#b3312a; --cat-rh:#7a3db8; --cat-tl:#1d7a4f;
  --cat-sp:#a34a0a; --cat-ma:#0b6f7c; --cat-ft:#8c2f61;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b24; --ink:#e7e9ef; --muted:#9aa1b2; --line:#2a3040;
  --accent:#7d93ff; --accent-ink:#0f1218; --warm:#e8a63c; --ok:#4fc18a; --danger:#f0736a;
  --cat-re:#7d93ff; --cat-gm:#f0736a; --cat-rh:#b88cf0; --cat-tl:#4fc18a; --cat-sp:#f0a35c; --cat-ma:#4cc3d1; --cat-ft:#e58fb9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b24; --ink:#e7e9ef; --muted:#9aa1b2; --line:#2a3040;
  --accent:#7d93ff; --accent-ink:#0f1218; --warm:#e8a63c; --ok:#4fc18a; --danger:#f0736a;
  --cat-re:#7d93ff; --cat-gm:#f0736a; --cat-rh:#b88cf0; --cat-tl:#4fc18a; --cat-sp:#f0a35c; --cat-ma:#4cc3d1; --cat-ft:#e58fb9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mast{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:36px 28px;border-bottom:2px solid var(--ink)}
.mast h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,76px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
.handle{font-family:var(--f-mono);color:var(--accent);font-size:13px;letter-spacing:.12em;margin-top:12px}
.tagline{font-size:19px;margin:0 0 10px;text-wrap:balance}
.about{color:var(--muted);margin:0;max-width:62ch}
.about,.summary,.tagline{white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-family:var(--f-mono);font-size:13px}
.stats{display:flex;gap:28px;flex-wrap:wrap;padding-block:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px}
.tab{font:600 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--cat-gm)}
.tab[data-page="main"][aria-current="page"]{border-bottom-color:var(--accent)}
.tab[data-page="sports"][aria-current="page"]{border-bottom-color:var(--cat-sp)}
.mast.sports h1{color:var(--cat-sp);font-size:clamp(34px,6vw,64px)}
.mast.games h1{color:var(--cat-gm);font-size:clamp(34px,6vw,64px)}
.social{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
.social a{border:1px solid var(--accent);padding:4px 10px;text-decoration:none}
.social a:hover{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px 22px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cart{--c:var(--accent);position:relative;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.cart.feat{grid-column:span 2}
.cart[data-cat="re"]{--c:var(--cat-re)}.cart[data-cat="gm"]{--c:var(--cat-gm)}.cart[data-cat="rh"]{--c:var(--cat-rh)}.cart[data-cat="tl"]{--c:var(--cat-tl)}.cart[data-cat="sp"]{--c:var(--cat-sp)}.cart[data-cat="ma"]{--c:var(--cat-ma)}.cart[data-cat="ft"]{--c:var(--cat-ft)}
.label{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c);color:var(--bg);padding:6px 30px 6px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;border-bottom:1px solid var(--line);background:var(--bg)}
.shotprev{width:160px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line)}
.cart h3{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.summary{margin:0;color:var(--muted);overflow-wrap:anywhere}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.stack span{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);padding:2px 7px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;border-top:1px dashed var(--line);padding-top:10px}
.mlinks{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end}
.mlinks .live{font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warm)}
.status.done::before{background:var(--ok)}
.muted{color:var(--muted)}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
footer{margin-top:48px;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* edit mode */
.btn{font:600 13px var(--f-body);padding:8px 14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:var(--bg);padding:10px 14px;margin-bottom:16px}
.editbar .btn{border-color:var(--bg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form .check{flex-direction:row;align-items:center;gap:8px}
input[type=text],input[type=url],textarea,select{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);padding:16px;margin-top:20px}
.confirm{color:var(--danger);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:20}
@media (max-width:700px){.mast{grid-template-columns:1fr;gap:16px}.cart.feat{grid-column:auto}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.cart{transition:transform .15s}.cart:hover{transform:translateY(-2px)}}
</style>

(function(){

const RESET_FALLBACK=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
function skeletonStyle(){
  try{const st=[...document.head.querySelectorAll('style')].find(x=>!x.id&&/safe-area-inset-top/.test(x.textContent)&&/\[hidden\]/.test(x.textContent));if(st)return st.textContent}catch(e){}
  return RESET_FALLBACK;
}
let saved=JSON.parse(document.getElementById('portfolio-data').textContent);

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
// Only allow real web links, so nothing can sneak in a javascript: URL.
function safeUrl(u){try{const x=new URL(String(u).trim());return (x.protocol==="https:"||x.protocol==="http:")?x.href:""}catch(e){return ""}}
function clean(s,max,keepBreaks){
  let t=String(s??"");
  if(keepBreaks) return t.replace(/\r\n?/g,"\n").replace(/[\u0000-\u0009\u000b\u000c\u000e-\u001f\u007f]/g," ").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim().slice(0,max);
  return t.replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,max);
}
function toast(msg,ms){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600)}

const LINKEDIN_URL="https://www.linkedin.com/in/juliansoriano/";
const INSTAGRAM_URL="https://www.instagram.com/soriano.thebroker";
function socials(pr){
  const items=[["LinkedIn",pr.linkedin||LINKEDIN_URL],["Instagram",pr.instagram||INSTAGRAM_URL]].map(([l,u])=>{u=safeUrl(u);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${l} ↗</a>`:""}).filter(Boolean);
  if(items.length) return `<div class="social">${items.join("")}</div>`;
  return canEdit?'<div class="social"><span class="muted">Add your LinkedIn and Instagram links with Edit page.</span></div>':"";
}

const IMG_OK=/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/;
function safeImg(u){u=String(u||"");return (u.length<=1200000&&IMG_OK.test(u))?u:""}
function shotHtml(p){const u=safeImg(p.img);return u?`<img class="shot" src="${u}" alt="${esc(p.imgAlt||("Screenshot of "+p.title))}" loading="lazy">`:""}
// Shrinks a picked image so the page stays small: at most 1280 px wide, saved as JPEG.
async function fileToShot(file){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,1280/bmp.width), w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h);
  return c.toDataURL('image/jpeg',0.82);
}

function card(p){
  if(isSport(p)){
    const link=safeUrl(p.site);
    return `<article class="cart${p.featured?' feat':''}" data-cat="${esc(p.category)}">
    <div class="label"><span>${esc(CODES[p.category])} · ${esc(CATS[p.category])}</span><span>${esc(p.year)}</span></div>
    <div class="body"><h3>${esc(p.title)}</h3><p class="summary">${esc(p.summary)}</p>
    <div class="stack">${(p.stack||[]).map(s=>`<span>${esc(s)}</span>`).join("")}</div>
    <div class="meta"><span class="status done">${esc(p.status)}</span><span class="mlinks">${link?`<a class="live" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Team site ↗</a>`:""}</span></div></div></article>`;
  }
  const repo=safeUrl(p.repo);
  const done=/released|complete|final/i.test(p.status);
  const site=safeUrl(p.site);
  const hack=safeUrl(p.hack);
  const repoHtml='<span class="mlinks">'+(hack?`<a class="live" href="${esc(hack)}" target="_blank" rel="noopener noreferrer">ROM hack page ↗</a>`:"")+(site?`<a class="live" href="${esc(site)}" target="_blank" rel="noopener noreferrer">Live site ↗</a>`:"")+(repo?`<a href="${esc(repo)}" target="_blank" rel="noopener noreferrer">Repo ↗</a>`:(p.privateRepo?`<span class="muted">Private repo</span>`:`<span class="muted">No public repo</span>`))+'</span>';
  return `<article class="cart${p.featured?' feat':''}" data-cat="${esc(p.category)}">
    <div class="label"><span>${esc(CODES[p.category]||"--")} · ${esc(CATS[p.category]||"Other")}</span><span>${esc(p.year)}</span></div>
    ${shotHtml(p)}<div class="body"><h3>${esc(p.title)}</h3><p class="summary">${esc(p.summary)}</p>
    <div class="stack">${(p.stack||[]).map(s=>`<span>${esc(s)}</span>`).join("")}</div>
    <div class="meta"><span class="status${done?' done':''}">${esc(p.status)}</span>${repoHtml}</div></div></article>`;
}

const STATUSES=["Planning","In development","Active","Released","Completed","Inactive"];
function statusOpts(cur){const l=STATUSES.includes(cur)||!cur?STATUSES:[cur,...STATUSES];return l.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join("")}
function editCard(p,i,n){

    ?`<span class="confirm">Delete this project?</span><button class="btn small danger" data-act="del-yes" data-id="${esc(p.id)}">Delete</button><button class="btn small" data-act="del-no">Keep</button>`
    :`<button class="btn small danger" data-act="del" data-id="${esc(p.id)}">Delete</button>`;
  return `<article class="cart feat" data-cat="${esc(p.category)}"><div class="label"><span>Editing · ${i+1} of ${n}</span><span></span></div>
  <div class="body"><div class="form" data-id="${esc(p.id)}">
    <label class="full">Title<input type="text" id="t-${esc(p.id)}" data-f="title" maxlength="80" value="${esc(p.title)}"></label>
    <label>Category<select id="c-${esc(p.id)}" data-f="category">${opts}</select></label>
    <label>Status<select id="s-${esc(p.id)}" data-f="status">${statusOpts(p.status)}</select></label>
    <label>${sp?'Years (for example 2019 to present)':'Year'}<input type="text" id="y-${esc(p.id)}" data-f="year" maxlength="24" value="${esc(p.year)}"></label>
    <label>${sp?'Tags (comma separated)':'Tech (comma separated)'}<input type="text" id="k-${esc(p.id)}" data-f="stack" maxlength="200" value="${esc((p.stack||[]).join(", "))}"></label>
    <label class="full">Description${sp?' (role, rank, results, highlights)':''}<textarea id="d-${esc(p.id)}" data-f="summary" maxlength="600">${esc(p.summary)}</textarea></label>
    ${sp?`<label class="full">Team or club link (optional)<input type="url" id="w-${esc(p.id)}" data-f="site" maxlength="300" placeholder="https://..." value="${esc(p.site)}"></label>`:`<label class="full">Repo link<input type="url" id="r-${esc(p.id)}" data-f="repo" maxlength="300" placeholder="https://github.com/..." value="${esc(p.repo)}"></label>
    <label class="full">Live site link (GitHub Pages)<input type="url" id="w-${esc(p.id)}" data-f="site" maxlength="300" placeholder="https://juliansoriano.github.io/..." value="${esc(p.site)}"></label>
    ${p.category==="rh"?`<label class="full">ROM hack page link (RomHacking.net or similar)<input type="url" id="h-${esc(p.id)}" data-f="hack" maxlength="300" placeholder="https://www.romhacking.net/hacks/..." value="${esc(p.hack)}"></label>`:""}
    <label class="check"><input type="checkbox" id="pv-${esc(p.id)}" data-f="privateRepo"${p.privateRepo?' checked':''}> Private repo</label>`}
    ${sp?'':`<div class="full row"><span class="muted">Screenshot</span>${safeImg(p.img)?`<img class="shotprev" src="${safeImg(p.img)}" alt="">`:""}<label class="btn small" style="cursor:pointer;text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--ink)">${safeImg(p.img)?'Replace':'Upload'} screenshot<input type="file" id="img-${esc(p.id)}" data-img="${esc(p.id)}" accept="image/png,image/jpeg,image/webp" hidden></label>${safeImg(p.img)?`<button class="btn small danger" data-act="rmimg" data-id="${esc(p.id)}">Remove</button>`:""}</div>`}
    <label class="check"><input type="checkbox" id="ft-${esc(p.id)}" data-f="featured"${p.featured?' checked':''}> Featured (wide card)</label>
  </div>
  <div class="row"><button class="btn small" data-act="up" data-id="${esc(p.id)}"${i===0?' disabled':''}>Move up</button><button class="btn small" data-act="down" data-id="${esc(p.id)}"${i===n-1?' disabled':''}>Move down</button>${del}</div>
  </div></article>`;
}

  const list=onPage.filter(p=>filter==="all"||p.category===filter);
  const linkHtml=(pr.links||[]).map(l=>{const u=safeUrl(l.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`:""}).join("");
  const counts={total:onPage.length,released:onPage.filter(p=>/released|final|complete/i.test(p.status)).length,repos:onPage.filter(p=>safeUrl(p.repo)).length,live:onPage.filter(p=>safeUrl(p.site)).length};
  const tabs=`<nav class="tabs" aria-label="Pages">${Object.keys(PAGES).map(k=>`<button class="tab" data-page="${k}"${page===k?' aria-current="page"':''}>${esc(PAGES[k].label)}</button>`).join("")}</nav>`;
  let h=`<div class="wrap">`;
  if(editing){
    h+=`<div class="editbar"><span>Editing. Changes go live for everyone when you publish.</span><span class="row">
      <button class="btn small" data-act="cancel">Discard changes</button>
      <button class="btn small primary" data-act="save"${saving?' disabled':''}>${saving?'Publishing…':'Publish changes'}</button></span></div>`;
  }
  h+=`<div class="topbar"><span>Portfolio · ${new Date().getFullYear()}</span>${canEdit&&!editing?'<button class="btn small" data-act="edit">Edit page</button>':''}</div>`+tabs;
  if(editing&&page==="sports"){
    h+=`<section class="panel"><div class="form"><label class="full">Sports page intro<textarea id="pf-sintro" data-p="sportsIntro" maxlength="600">${esc(pr.sportsIntro)}</textarea></label></div></section>`;
  } else if(editing&&page==="games"){
    h+=`<section class="panel"><div class="form"><label class="full">Gaming page intro<textarea id="pf-gintro" data-p="gamesIntro" maxlength="600">${esc(pr.gamesIntro)}</textarea></label></div></section>`;
  } else if(editing){
    h+=`<section class="panel"><div class="form">
      <label>Name<input type="text" id="pf-name" data-p="name" maxlength="60" value="${esc(pr.name)}"></label>
      <label>Handle (shown on Gaming page)<input type="text" id="pf-handle" data-p="handle" maxlength="40" value="${esc(pr.handle)}"></label>
      <label>LinkedIn page link<input type="url" id="pf-linkedin" data-p="linkedin" maxlength="300" placeholder="https://www.linkedin.com/in/..." value="${esc(pr.linkedin)}"></label>
      <label>Instagram page link<input type="url" id="pf-instagram" data-p="instagram" maxlength="300" placeholder="https://www.instagram.com/..." value="${esc(pr.instagram)}"></label>
      <label class="full">Tagline<input type="text" id="pf-tag" data-p="tagline" maxlength="140" value="${esc(pr.tagline)}"></label>
      <label class="full">About<textarea id="pf-about" data-p="about" maxlength="900">${esc(pr.about)}</textarea></label>
      <label class="full">Links (one per line: Label | https://...)<textarea id="pf-links" data-p="links" maxlength="1200">${esc((pr.links||[]).map(l=>l.label+" | "+l.url).join("\n"))}</textarea></label>
    </div></section>`;
  } else if(page==="sports"){
    const active=onPage.filter(p=>/^(active|current)/i.test(p.status)).length;
    h+=`<header class="mast sports"><div><h1>Martial Arts &amp; Athletics</h1><div class="handle">${esc(pr.name)}</div></div>
      <div><p class="about">${esc(pr.sportsIntro)}</p></div></header>
      <div class="stats"><div><b>${onPage.length}</b>Entries</div><div><b>${active}</b>Active</div></div>`;
  } else if(page==="games"){
    h+=`<header class="mast games"><div><h1>Gaming Projects</h1><div class="handle">by ${esc(pr.handle||pr.name)}</div></div>
      <div><p class="about">${esc(pr.gamesIntro)}</p><div class="links">${linkHtml}</div></div></header>
      <div class="stats"><div><b>${counts.total}</b>Projects</div><div><b>${counts.released}</b>Released</div><div><b>${counts.repos}</b>Public repos</div><div><b>${counts.live}</b>Live sites</div></div>`;
  } else {
    h+=`<header class="mast"><div><h1>${esc(pr.name)}</h1>${socials(pr)}</div>
      <div><p class="tagline">${esc(pr.tagline)}</p><p class="about">${esc(pr.about)}</p><div class="links">${linkHtml}</div></div></header>
      <div class="stats"><div><b>${counts.total}</b>Projects</div><div><b>${counts.released}</b>Released</div><div><b>${counts.repos}</b>Public repos</div><div><b>${counts.live}</b>Live sites</div></div>`;
  }
  if(!editing){
    h+=`<nav class="filters" aria-label="Filter projects"><button class="chip" data-filter="all" aria-pressed="${filter==='all'}">All</button>${cats.map(k=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${esc(CATS[k])}</button>`).join("")}</nav>`;
    h+=`<section class="grid">${list.length?list.map(card).join(""):'<div class="empty">No projects here yet.</div>'}</section>`;
  } else {
    h+=`<div class="row" style="margin-block:20px 14px"><button class="btn primary" data-act="add">Add project</button></div>`;
    h+=`<section class="grid">${onPage.length?onPage.map((p,i)=>editCard(p,i,onPage.length)).join(""):'<div class="empty">No projects on this page yet. Use Add project.</div>'}</section>`;
  }
  h+=`<footer><span>${esc(pr.name)} · Toronto</span><span>${canEdit?'Signed in as editor':'Read-only view'}</span></footer></div>`;
  app.innerHTML=h;
}

app.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.p){
    if(el.dataset.p==="links"){
      data.profile.links=el.value.split("\n").map(l=>{const [a,...b]=l.split("|");return {label:clean(a,40),url:clean(b.join("|"),300)}}).filter(l=>l.label&&l.url);
    } else data.profile[el.dataset.p]=el.value;
    return;
  }
  const f=el.dataset.f, form=el.closest('.form'); if(!f||!form) return;
  const p=data.projects.find(x=>x.id===form.dataset.id); if(!p) return;
  if(f==="stack") p.stack=el.value.split(",").map(s=>clean(s,30)).filter(Boolean).slice(0,12);
  else if(el.type==="checkbox") p[f]=el.checked;
  else p[f]=el.value;
});
app.addEventListener('change',async e=>{
  const fi=e.target.dataset&&e.target.dataset.img;
  if(fi){const f=e.target.files&&e.target.files[0];if(!f)return;const p=data.projects.find(x=>x.id===fi);if(!p)return;
    try{const u=await fileToShot(f);if(u.length>1200000){toast("That image is too large. Try a smaller screenshot.",5000);return}p.img=u;p.imgAlt="Screenshot of "+p.title;render();toast("Screenshot added. Press Publish changes to save it.",4000)}catch(err){toast("Couldn't read that image. Use a PNG, JPEG or WebP file.",5000)}
    return}
  if(e.target.dataset.f==="category"){const to=Object.keys(PAGES).find(k=>PAGES[k].cats.includes(e.target.value));if(to!==page)toast("Moved to the "+PAGES[to].label+" page");render()}});
function go(k){if(!PAGES[k]||k===page)return;page=k;filter="all";confirmId=null;try{history.replaceState(null,"","#"+k)}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>go(pageFromHash()));

app.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-page]'); if(tb){go(tb.dataset.page);return}
  const fb=e.target.closest('[data-filter]'); if(fb){filter=fb.dataset.filter;render();return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, i=data.projects.findIndex(p=>p.id===id);
  if(act==="edit"){if(!canEdit)return;data=clone(saved);editing=true;render();}
  else if(act==="cancel"){data=clone(saved);editing=false;confirmId=null;render();}
  else if(act==="add"){data.projects.unshift({id:"p"+Date.now().toString(36),title:"New project",category:PAGES[page].def,status:"In development",year:String(new Date().getFullYear()),summary:"",stack:[],repo:"",site:"",privateRepo:false,featured:false});render();}
  else if(act==="up"||act==="down"){
    const idx=data.projects.map((p,k)=>PAGES[page].cats.includes(p.category)?k:-1).filter(k=>k>=0);
    const pos=idx.indexOf(i), other=idx[act==="up"?pos-1:pos+1];
    if(pos>=0&&other!==undefined){[data.projects[i],data.projects[other]]=[data.projects[other],data.projects[i]];render();}
  }
  else if(act==="rmimg"){const p=data.projects.find(x=>x.id===id);if(p){p.img="";p.imgAlt="";render();}}
  else if(act==="del"){confirmId=id;render();}
  else if(act==="del-no"){confirmId=null;render();}
  else if(act==="del-yes"){data.projects.splice(i,1);confirmId=null;render();}
  else if(act==="save"){await save();}
});

function sanitize(d){
  return {profile:{name:clean(d.profile.name,60)||"Your name",handle:clean(d.profile.handle,40),tagline:clean(d.profile.tagline,140),about:clean(d.profile.about,900,true),sportsIntro:clean(d.profile.sportsIntro,600,true),gamesIntro:clean(d.profile.gamesIntro,600,true),linkedin:safeUrl(d.profile.linkedin),instagram:safeUrl(d.profile.instagram),
      links:(d.profile.links||[]).filter(l=>safeUrl(l.url)).slice(0,10).map(l=>({label:clean(l.label,40),url:safeUrl(l.url)}))},
    projects:d.projects.slice(0,60).map(p=>({id:clean(p.id,24).replace(/[^a-z0-9]/gi,"")||("p"+Math.random().toString(36).slice(2,8)),title:clean(p.title,80)||"Untitled",
      category:CATS[p.category]?p.category:"tl",status:clean(p.status,40),year:clean(p.year,24),summary:clean(p.summary,600,true),
      stack:(p.stack||[]).map(s=>clean(s,30)).filter(Boolean).slice(0,12),repo:safeUrl(p.repo),site:safeUrl(p.site),hack:safeUrl(p.hack),privateRepo:!!p.privateRepo,featured:!!p.featured,img:safeImg(p.img),imgAlt:clean(p.imgAlt,160)}))};
}

function buildDocument(d){
  const style=document.getElementById('page-style').textContent;
  const script=document.getElementById('page-script').textContent;
  const json=JSON.stringify(d).replace(/</g,"\\u003c");
  const t=esc(d.profile.name)+" Portfolio";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+skeletonStyle()+'</style></head><body>\n'
    +'<title>'+t+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">\n'
    +'<style id="page-style">'+style+'</style>\n<div id="app"></div>\n'
    +'<script type="application/json" id="portfolio-data">'+json+'<\/script>\n'
    +'<script id="page-script">'+script+'<\/script>\n\n</body></html>';
}

// If the page was updated while you were editing, your edits are kept for the reload
// and re-applied on top of the newest version (only the fields you changed).
function mergeDraft(cur,base,dr){
  const out=clone(cur); out.profile=out.profile||{};
  for(const k of Object.keys(dr.profile)){ if(JSON.stringify(dr.profile[k])!==JSON.stringify(base.profile[k])) out.profile[k]=dr.profile[k]; }
  const bBy=new Map(base.projects.map(x=>[x.id,x])), dBy=new Map(dr.projects.map(x=>[x.id,x]));
  out.projects=out.projects.filter(x=>!(bBy.has(x.id)&&!dBy.has(x.id)))
    .map(x=>{const b=bBy.get(x.id),n=dBy.get(x.id);return (b&&n&&JSON.stringify(b)!==JSON.stringify(n))?n:x});
  dr.projects.filter(x=>!bBy.has(x.id)).reverse().forEach(x=>out.projects.unshift(x));
  return out;
}

async function save(){
  if(!artifactApi||saving) return;
  saving=true;render();
  const tidy=sanitize(data);
  try{sessionStorage.setItem('portfolio-draft',JSON.stringify({base:sanitize(saved),draft:tidy}))}catch(e){}
  try{
    await artifactApi.publish(buildDocument(tidy));
    try{sessionStorage.removeItem('portfolio-draft')}catch(e){}
    saved=clone(tidy); data=clone(tidy); editing=false; saving=false; confirmId=null;
    render(); toast("Published. Your changes are live.");
  }catch(err){
    saving=false;
    const code=(err&&err.code)||"unknown", msg=String((err&&err.message)||"").slice(0,140);
    if(code==="conflict"){render();toast("The page was updated while you were editing. Reloading it and re-applying your changes.",5000);}
    else if(code==="not_writer"||code==="not_granted"){canEdit=false;editing=false;data=clone(saved);try{sessionStorage.removeItem('portfolio-draft')}catch(e){}render();toast("This account can view the page but not edit it.",5000);}
    else if(code==="consent_required"){render();toast("Publishing needs your permission. Press Publish changes again and choose Allow.",6000);}
    else if(code==="rate_limited"){render();toast("Too many saves in a row. Wait a minute, then publish again.",5000);}
    else {render();toast("Couldn't publish ("+code+"). "+msg,7000);}
  }
}

render();
})();
</script>
